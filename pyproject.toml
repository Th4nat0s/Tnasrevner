[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tnasrevner"
version = "0.1.0"
description = "Reverse-engineering workspace for electronic circuit boards"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
tnasrevner = "tnasrevner.gui:main"

[tool.setuptools.package-data]
tnasrevner = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]
